[build-system]
requires = ["packaging~=24.2", "setuptools~=75.8", "wheel~=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "fairseq2"
dynamic = ["version"]
description = "FAIR Sequence Modeling Toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fundamental AI Research (FAIR) at Meta"},
]
maintainers = [
    {name = "Fundamental AI Research (FAIR) at Meta"},
]
keywords = ["machine learning", "deep learning", "sequence modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "clusterscope~=0.0.31",
    "editdistance~=0.8",
    "fairseq2n>=0.8.0.dev0,<=0.8.0",
    "huggingface_hub~=0.32",
    "importlib_metadata~=7.0",
    "importlib_resources~=6.4",
    "mypy-extensions~=1.0",
    "packaging~=24.1",
    "psutil~=5.9",
    "ruamel.yaml~=0.18",
    "rich~=14.2",
    "sacrebleu~=2.4",
    "safetensors~=0.6",
    "tensorboard~=2.20",
    "tiktoken[blobfile]~=0.12",
    "torcheval~=0.0.6",
    "transformers~=4.57",
    "typing_extensions~=4.12",
    "wandb~=0.22",
]

[project.optional-dependencies]
arrow = [
    "pyarrow>=17.0",
    "retrying~=1.3",
    "pandas~=2.0",
    "polars~=1.19",
    "xxhash~=3.5",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/fairseq2"
Documentation = "https://facebookresearch.github.io/fairseq2/"
Repository = "https://github.com/facebookresearch/fairseq2"

[tool.setuptools.dynamic]
version = {attr = "fairseq2.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fairseq2" = ["py.typed"]
"fairseq2.assets.cards" = ["**/*.yaml"]

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.black]
extend-exclude = "third-party"

[tool.flake8]
extend_exclude = ["third-party"]
extend_ignore = ["E", "Y"]  # Black
per-file-ignores = [
    "__init__.py:F401",
]

[tool.isort]
extend_skip = "third-party"
profile = "black"

[tool.mypy]
disable_error_code = "type-abstract,typeddict-unknown-key"
disallow_untyped_calls = false
disallow_untyped_decorators = false
files = "setup.py,src,tests,recipes"
python_version = "3.10"
show_error_codes = true
show_error_context = true
strict = true
enable_error_code = "possibly-undefined,redundant-expr,truthy-bool,truthy-iterable"
warn_unused_configs = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "torch.distributed.*,torch.optim.*"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "fairseq2.data.parquet.*,tests.unit.data.parquet.*,tests.integration.parquet.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.1"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:pkg_resources is deprecated:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:To copy construct from a tensor:UserWarning",
]

# =============================================================================
# Dependency Groups (PEP 735)
# =============================================================================

[dependency-groups]
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.0",
]
lint = [
    "black~=25.1",
    "flake8~=7.1",
    "flake8-pyi~=24.6",
    "flake8-pyproject~=1.2",
    "isort~=6.0",
    "mypy~=1.15",
    "shellcheck-py~=0.9",
    "types-editdistance~=0.6",
    "types-psutil~=5.9",
    "types-setuptools~=75.8",
]
doc = [
    "sphinx~=7.4.0",
    "sphinxcontrib-bibtex~=2.5.0",
    "sphinx-favicon~=1.0.1",
    "sphinx-design~=0.5.0",
    "myst-parser~=4.0.0",
    "sphinxcontrib-mermaid~=1.0.0",
    "furo==2024.8.6",
    "nbsphinx~=0.9.6",
    "ipython~=8.31.0",
    "pytest-sphinx~=0.6.3",
]
data = [
    "pyarrow>=17.0",
    "pandas~=2.0",
    "polars~=1.19",
]

# =============================================================================
# pixi Configuration
# =============================================================================

[tool.pixi.workspace]
name = "fairseq2"
channels = ["conda-forge"]
# NOTE: pixi configuration is for Linux development and CI only.
# fairseq2n only has wheels for linux-64 (no macOS or Windows wheels).
# For local macOS/Windows development, use pip: `pip install -e .`
# The pixi lockfile must be generated on a Linux machine.
platforms = ["linux-64"]

# Conda dependencies (shared across all environments)
[tool.pixi.dependencies]
python = ">=3.10,<3.13"

# Global PyPI options for index strategy
[tool.pixi.pypi-options]
index-strategy = "unsafe-best-match"

[tool.pixi.pypi-dependencies]
fairseq2 = { path = ".", editable = true }

# =============================================================================
# pixi Features (Hardware Variants)
# =============================================================================

# CPU feature (linux-64 only - fairseq2n requires Linux)
[tool.pixi.feature.cpu.pypi-options]
extra-index-urls = [
    "https://download.pytorch.org/whl/cpu",
    "https://fair.pkg.atmeta.com/fairseq2/whl/nightly/pt2.9.1/cpu/"
]

[tool.pixi.feature.cpu.pypi-dependencies]
torch = "==2.9.1+cpu"
torchaudio = "==2.9.1+cpu"
torchvision = "==0.24.1+cpu"
fairseq2n = ">=0.8.0.dev0,<=0.8.0"

# CUDA 12.4 feature (linux-64 only)
[tool.pixi.feature.cu124]
platforms = ["linux-64"]

[tool.pixi.feature.cu124.pypi-options]
extra-index-urls = [
    "https://download.pytorch.org/whl/cu124",
    "https://fair.pkg.atmeta.com/fairseq2/whl/nightly/pt2.9.1/cu124/"
]

[tool.pixi.feature.cu124.pypi-dependencies]
torch = ">=2.9.0,<2.10.0"
torchaudio = ">=2.9.0,<2.10.0"
torchvision = ">=0.24.0,<0.25.0"
fairseq2n = ">=0.8.0.dev0,<=0.8.0"

# CUDA 12.8 feature (linux-64 only)
[tool.pixi.feature.cu128]
platforms = ["linux-64"]

[tool.pixi.feature.cu128.pypi-options]
extra-index-urls = [
    "https://download.pytorch.org/whl/cu128",
    "https://fair.pkg.atmeta.com/fairseq2/whl/nightly/pt2.9.1/cu128/"
]

[tool.pixi.feature.cu128.pypi-dependencies]
torch = ">=2.9.0,<2.10.0"
torchaudio = ">=2.9.0,<2.10.0"
torchvision = ">=0.24.0,<0.25.0"
fairseq2n = ">=0.8.0.dev0,<=0.8.0"

# =============================================================================
# pixi Feature: Development Tools
# =============================================================================

[tool.pixi.feature.dev.pypi-dependencies]
pytest = "~=8.4"
pytest-asyncio = "~=1.0"

[tool.pixi.feature.lint.pypi-dependencies]
black = "~=25.1"
flake8 = "~=7.1"
flake8-pyi = "~=24.6"
flake8-pyproject = "~=1.2"
isort = "~=6.0"
mypy = "~=1.15"
shellcheck-py = "~=0.9"
types-editdistance = "~=0.6"
types-psutil = "~=5.9"
types-setuptools = "~=75.8"

[tool.pixi.feature.doc.pypi-dependencies]
sphinx = "~=7.4.0"
sphinxcontrib-bibtex = "~=2.5.0"
sphinx-favicon = "~=1.0.1"
sphinx-design = "~=0.5.0"
myst-parser = "~=4.0.0"
sphinxcontrib-mermaid = "~=1.0.0"
furo = "==2024.8.6"
nbsphinx = "~=0.9.6"
ipython = "~=8.31.0"
pytest-sphinx = "~=0.6.3"

[tool.pixi.feature.data.pypi-dependencies]
pyarrow = ">=17.0"
pandas = "~=2.0"
polars = "~=1.19"

# =============================================================================
# pixi Environments
# =============================================================================

[tool.pixi.environments]
default = { features = ["cpu", "dev", "lint"], solve-group = "cpu" }
cpu = { features = ["cpu", "dev", "lint"], solve-group = "cpu" }
cu124 = { features = ["cu124", "dev", "lint"], solve-group = "cu124" }
cu128 = { features = ["cu128", "dev", "lint"], solve-group = "cu128" }
doc = { features = ["cpu", "doc"], solve-group = "doc" }
full = { features = ["cpu", "dev", "lint", "data", "doc"], solve-group = "full" }

# =============================================================================
# pixi Tasks
# =============================================================================

[tool.pixi.tasks]
test = "pytest tests/unit"
test-all = "pytest tests"
lint = "flake8 src tests"
format = "black src tests && isort src tests"
typecheck = "mypy"
doc-build = { cmd = "sphinx-build -W doc/source doc/build/html", depends-on = [] }
doc-serve = { cmd = "python -m http.server -d doc/build/html 8000", depends-on = ["doc-build"] }
