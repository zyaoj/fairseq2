[project]
name = "urology-data-platform"
version = "0.1.0"
description = "Multi-modal patient data platform for urology"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "anthropic>=0.18.0",
    "pdfplumber>=0.10.3",
    "pymilvus>=2.3.6",
    "minio>=7.2.3",
    "httpx>=0.26.0",
    "python-docx>=1.1.0",
    "openai>=1.12.0",
    "voyageai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
]
ui = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
urology-data-platform = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev", "ui"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
python = ">=3.11"

[tool.pixi.feature.ui.dependencies]
